name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            mold \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --verbose

      - name: cargo test
        run: cargo test --verbose

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: wlgrid-release
          path: target/release/wlgrid
          retention-days: 1

  benches:
    name: Micro-benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            mold \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # We run benches primarily to catch regressions where they fail to
      # compile or crash. Shared GitHub runners are too noisy (±20-30%) to
      # meaningfully gate on absolute numbers, so this job just ensures the
      # bench harness still works; the report is uploaded as an artifact for
      # humans to eyeball.
      - name: cargo bench
        run: cargo bench --no-fail-fast -- --output-format bencher | tee bench-output.txt

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-output.txt
            target/criterion/

  headless-smoke:
    name: Headless first-frame smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            xwayland \
            sway \
            imagemagick

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: wlgrid-release
          path: target/release

      - name: Mark binary executable
        run: chmod +x target/release/wlgrid

      # Three-phase run under headless sway, timed with `wlgrid -t`:
      #   1. cold   — no cache, no state; exercises the slow icon load path
      #   2. warm   — icon cache present from phase 1; should be much faster
      #              and load the same number of entries
      #   3. newent — fabricate a new .desktop + icon; it should be picked up
      #              with its real icon (an icon cache miss, then loaded)
      #
      # wlgrid runs until Escape, so each run is stopped by `timeout` after
      # it has had time to present its first frame and write the cache.
      # Sway is started once and reused across all three runs.
      - name: Three-phase timing run under headless sway
        run: |
          set -u
          export WLR_BACKENDS=headless
          export WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER=pixman
          export XDG_RUNTIME_DIR=/tmp/wlgrid-ci-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          cat > /tmp/sway-ci.conf <<'EOF'
          output HEADLESS-1 mode 1920x1080
          xwayland disable
          EOF

          sway --config /tmp/sway-ci.conf --unsupported-gpu > /tmp/sway.log 2>&1 &
          SWAY_PID=$!
          cleanup() {
            kill $SWAY_PID 2>/dev/null || true
            wait $SWAY_PID 2>/dev/null || true
            echo "--- sway log ---"
            cat /tmp/sway.log 2>/dev/null || true
            echo "--- end sway log ---"
          }
          trap cleanup EXIT

          for i in $(seq 1 100); do
            sock=$(ls "$XDG_RUNTIME_DIR"/wayland-* 2>/dev/null | head -1 || true)
            if [ -n "$sock" ]; then break; fi
            sleep 0.1
          done
          if [ -z "${sock:-}" ]; then
            echo "::error::sway never published a Wayland socket"
            exit 1
          fi
          export WAYLAND_DISPLAY=$(basename "$sock")
          echo "using WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
          rm -rf ~/.config/wlgrid ~/.cache/wlgrid

          run() {
            echo "=== $1 ==="
            timeout 3 ./target/release/wlgrid -t > /tmp/wlgrid-$1.txt 2>&1 || true
            cat /tmp/wlgrid-$1.txt
          }
          # Whole milliseconds at which a log line containing $2 appeared.
          at() { awk -v pat="$2" 'index($0, pat) { sub(/ms$/, "", $1); print int($1); exit }' /tmp/wlgrid-$1.txt; }
          entries() { awk '/ entries loaded$/ { print $2; exit }' /tmp/wlgrid-$1.txt; }

          fail=0
          check_frame() {
            t=$(at "$1" "first frame presented")
            if [ -z "$t" ]; then
              echo "::error::$1: no frame was presented"; fail=1
            elif [ "$t" -gt "$2" ]; then
              echo "::error::$1: first frame presented at ${t}ms, over the ${2}ms budget"; fail=1
            fi
          }

          # ─── Phase 1: cold ─────────────────────────────────────────────
          run cold
          ENTRIES_COLD=$(entries cold)
          REAL_COLD=$(grep -c "': loaded$" /tmp/wlgrid-cold.txt || true)
          echo "cold: first frame $(at cold 'first frame presented')ms, entries=$ENTRIES_COLD, icons loaded=$REAL_COLD"
          check_frame cold 3000
          [ "${ENTRIES_COLD:-0}" -eq 0 ] && { echo "::error::cold: 0 entries — desktop entry scan appears broken"; fail=1; }
          [ "${REAL_COLD:-0}" -eq 0 ] && { echo "::error::cold: no icon files loaded — icon pipeline appears broken"; fail=1; }

          # ─── Phase 2: warm (icon cache hit expected) ───────────────────
          run warm
          ENTRIES_WARM=$(entries warm)
          echo "warm: first frame $(at warm 'first frame presented')ms, entries=$ENTRIES_WARM"
          check_frame warm 100
          grep -q "cache: miss" /tmp/wlgrid-warm.txt && { echo "::error::warm: icon cache missed — cache appears broken"; fail=1; }
          [ "${ENTRIES_WARM:-0}" -ne "${ENTRIES_COLD:-0}" ] && { echo "::error::warm: $ENTRIES_WARM entries, cold had $ENTRIES_COLD"; fail=1; }

          # ─── Phase 3: new desktop entry + icon ─────────────────────────
          mkdir -p ~/.local/share/applications
          mkdir -p ~/.local/share/icons/hicolor/48x48/apps
          convert -size 48x48 xc:purple \
            ~/.local/share/icons/hicolor/48x48/apps/wlgrid-ci-test.png
          cat > ~/.local/share/applications/wlgrid-ci-test.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=WlgridCITest
          Exec=/bin/true
          Icon=wlgrid-ci-test
          EOF

          run newent
          ENTRIES_NEW=$(entries newent)
          echo "newent: first frame $(at newent 'first frame presented')ms, entries=$ENTRIES_NEW"
          check_frame newent 200
          [ "${ENTRIES_NEW:-0}" -ne $((${ENTRIES_WARM:-0} + 1)) ] && { echo "::error::newent: $ENTRIES_NEW entries, expected $((${ENTRIES_WARM:-0} + 1))"; fail=1; }
          grep -q "icon 'wlgrid-ci-test': loaded" /tmp/wlgrid-newent.txt || { echo "::error::newent: the new entry's icon wasn't loaded"; fail=1; }

          exit $fail

