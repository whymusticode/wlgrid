[package]
name = "wlgrid"
version = "0.1.0"
edition = "2024"

# Size mitigations. opt-level stays at 3 — the <100ms time-to-first-frame
# budget depends on icon decode/resize throughput, so trading speed for size
# there isn't worth it. fat LTO + a single codegen unit let the linker drop
# unreachable code across crate boundaries (and generally get *faster* code),
# abort-on-panic removes the unwind tables and landing pads, and strip drops
# the symbol table.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-cursor = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.45"
walkdir = "2"
ab_glyph = "0.2"
bincode = "1"
libc = "0.2"
bytemuck = "1.25.0"

[dev-dependencies]
libloading = "0.8"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "startup"
harness = false
path = "test/startup.rs"

[[bench]]
name = "test_render"
harness = false
path = "test/test_render.rs"
